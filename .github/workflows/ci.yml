name: CI

on:
  push:
    branches: [ main, master, release/main-to-staging ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify-secrets:
    name: Verify Secrets & Repository Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify sensitive files not committed
        run: |
          set -e
          echo "Checking for committed sensitive files..."
          
          if git ls-files --error-unmatch .env.local >/dev/null 2>&1; then
            echo "❌ ERROR: .env.local is committed to repository"
            exit 1
          fi
          
          if git ls-files --error-unmatch serviceAccountKey.json >/dev/null 2>&1; then
            echo "❌ ERROR: serviceAccountKey.json is committed to repository"
            exit 1
          fi
          
          if git grep -n "\"private_key\"" -- ':!*node_modules*' ':!*.md' >/dev/null 2>&1; then
            echo "❌ ERROR: Found literal 'private_key' in code"
            exit 1
          fi
          
          echo "✅ No sensitive files committed"

  build:
    name: Install, Lint, Type Check, Build & Test
    runs-on: ubuntu-latest
    needs: verify-secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Audit dependencies (fail on high vulnerabilities)
        run: |
          echo "Running npm audit (will fail CI on any high severity vulnerabilities)"
          npm audit --omit=dev --audit-level=high

      - name: Run production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Check Vercel token availability
        id: vercel-token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is unavailable; skipping deployment."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vercel Deploy
        if: ${{ steps.vercel-token.outputs.available == 'true' }}
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
