name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Install, Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high vulnerabilities)
        run: |
          echo "Running npm audit (will fail CI on any high severity vulnerabilities)"
          npm audit --audit-level=high

      - name: Update baseline-browser-mapping (silence warning)
        run: npm i baseline-browser-mapping@latest -D

      - name: Run production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vercel Deploy
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Scan for accidentally committed secrets
        run: |
          set -e
          if git ls-files --error-unmatch .env.local > /dev/null 2>&1; then
            echo "Error: .env.local is committed."; exit 1;
          fi
          if git ls-files --error-unmatch serviceAccountKey.json > /dev/null 2>&1; then
            echo "Error: serviceAccountKey.json is committed."; exit 1;
          fi
          if git grep -n "\"private_key\"" -- ':!*node_modules*' ':!*.md' > /dev/null 2>&1; then
            echo "Error: Found literal 'private_key' in code (not docs)."; exit 1;
          fi

      - name: Verify Firebase Admin is skipped during CI
        run: |
          echo "Firebase Admin initialization is skipped during CI (CI=true)."
          echo "Credentials are only required for Vercel deployment."

