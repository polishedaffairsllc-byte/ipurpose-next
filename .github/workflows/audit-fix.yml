name: Audit Fix PR

on:
  workflow_dispatch: {}

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit fix
        run: |
          set -e
          npm audit fix || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json || true
          git commit -m "chore: apply npm audit fix" || echo "no changes to commit"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: apply npm audit fix"
          branch: audit-fix/npm-audit-fix
          title: "chore: apply npm audit fix"
          body: |
            This PR was created automatically by the `audit-fix` workflow.
            It runs `npm audit fix` and proposes dependency updates to resolve vulnerabilities.
