name: Trusted release controller tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  controller-tests:
    name: Level 2A autonomous controller unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/level2a-release-controller.test.mjs
