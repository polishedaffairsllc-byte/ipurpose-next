name: Level 2A advisory PR screen

# Runs from the protected default branch. NEVER checkout or execute PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  advisory-risk-screen:
    name: Level 2A advisory risk screen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect GitHub PR file metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Read-only advisory screen for PR #${PR_NUMBER} at ${PR_HEAD_SHA}"
          # No checkout, no PR scripts, no deploy secrets, no write permissions.
          # Pagination is deliberately fail-closed: any >2-file PR is blocked.
          api="https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=3"
          response="$(curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "${api}")"
          echo "${response}" | jq -e 'type == "array"' >/dev/null
          count="$(echo "${response}" | jq 'length')"
          if [ "${count}" -lt 1 ] || [ "${count}" -gt 2 ]; then
            echo "::notice::Not eligible: zero or more than two files"
            exit 0
          fi
          if ! echo "${response}" | jq -e 'all(.[]; (.status == "added" or .status == "modified") and (.filename | startswith("components/") or startswith("src/components/")) and (.filename | test("(?i)(auth|login|signup|account|password|session|token|secret|privacy|consent|payment|billing|stripe|firestore|database|migration|security|admin|api/|middleware|proxy|analytics|tracking|vercel|policy|workflow|release|deploy|permission)") | not) and (.additions <= 150) and (.changes <= 250))' >/dev/null; then
            echo "::notice::Not eligible: path, status, or size outside low-risk bounds"
            exit 0
          fi
          echo "::notice::File metadata fits preliminary LOW-risk bounds; code-content and immutable SHA checks still required. RELEASE NOT AUTHORIZED."
          # Success only means advisory completed; never use this job alone
          # as a required authorization signal or automatic merge trigger.
