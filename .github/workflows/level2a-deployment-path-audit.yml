name: Level 2A deployment path audit

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/level2a-deployment-path-audit.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/level2a-deployment-path-audit.test.mjs'

permissions:
  contents: read

jobs:
  audit-deployment-paths:
    name: Level 2A no duplicate Vercel deployment paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/level2a-deployment-path-audit.test.mjs
