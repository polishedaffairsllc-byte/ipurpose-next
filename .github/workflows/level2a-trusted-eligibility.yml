name: Level 2A trusted release eligibility (NO DEPLOY)

# Manual rehearsal only. Protected default-branch code; no PR checkout.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to evaluate without merging"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  fail-closed-release-eligibility:
    name: Level 2A independent release eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check trusted switches, immutable PR and required checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ENABLED: ${{ vars.LEVEL2A_ENABLED }}
          EMERGENCY_STOP: ${{ vars.LEVEL2A_EMERGENCY_STOP }}
        run: |
          set -euo pipefail
          deny() { echo "::error::$1"; exit 1; }
          # Default OFF. These variables must be protected by repository admin
          # before any future controller gains write privileges.
          [[ "${ENABLED}" == "true" ]] || deny "Level 2A disabled or unconfigured"
          [[ "${EMERGENCY_STOP}" == "false" ]] || deny "Emergency stop active or unconfigured"
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || deny "Invalid PR number"
          api() {
            curl --fail --silent --show-error --retry 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/$1"
          }
          pr="$(api "pulls/${PR_NUMBER}")" || deny "Cannot inspect PR"
          echo "${pr}" | jq -e --arg repo "${REPOSITORY}" '
            .state == "open" and .draft == false and .mergeable == true and
            .base.ref == "main" and .base.repo.full_name == $repo and
            .head.repo.full_name == $repo and (.head.sha | test("^[a-f0-9]{40}$"))
          ' >/dev/null || deny "PR state, source, base or mergeability not eligible"
          head="$(echo "${pr}" | jq -r '.head.sha')"
          base="$(echo "${pr}" | jq -r '.base.sha')"
          files="$(api "pulls/${PR_NUMBER}/files?per_page=3")" || deny "Cannot inspect files"
          echo "${files}" | jq -e '
            (length >= 1 and length <= 2) and
            all(.[];
              (.status == "added" or .status == "modified") and
              (.filename | startswith("src/components/") or startswith("components/")) and
              (.filename | test("(?i)(auth|login|signup|account|password|session|token|secret|privacy|consent|payment|billing|stripe|firestore|database|migration|security|admin|api/|middleware|proxy|analytics|tracking|vercel|policy|workflow|release|deploy|permission)") | not) and
              (.additions <= 150) and (.changes <= 250) and
              (.patch | type == "string") and
              (.patch | test("(?i)(dangerouslySetInnerHTML|eval\\(|new Function\\(|fetch\\(|localStorage|sessionStorage|document.cookie|process.env|NEXT_PUBLIC_|use server|server action|window.location|XMLHttpRequest|navigator.sendBeacon|WebSocket\\(|import\\(|require\\(|child_process|postMessage\\()") | not)
            )
          ' >/dev/null || deny "Sensitive or oversized change; missing diff patch; release denied"
          checks="$(api "commits/${head}/check-runs?per_page=100")" || deny "Cannot inspect required checks"
          for name in \
            "Verify Secrets & Repository Safety" \
            "Firestore alignment regression tests" \
            "Install, Lint, Type Check, Build & Test" \
            "Verify Repository & Type Safety" \
            "Tests, types, lint and unsigned mobile exports"; do
            echo "${checks}" | jq -e --arg name "${name}" --arg head "${head}" '
              [.check_runs[] | select(.name == $name and .head_sha == $head and
                .app.slug == "github-actions" and .status == "completed" and
                .conclusion == "success")] | length == 1
            ' >/dev/null || deny "Required CI check missing, failing, duplicate or untrusted: ${name}"
          done
          fresh="$(api "pulls/${PR_NUMBER}")" || deny "Cannot revalidate PR"
          echo "${fresh}" | jq -e --arg head "${head}" --arg base "${base}" '
            .state == "open" and .draft == false and .mergeable == true and
            .head.sha == $head and .base.sha == $base
          ' >/dev/null || deny "PR SHA changed during inspection"
          echo "::notice::Eligibility rehearsal PASSED for ${head}; RELEASE NOT AUTHORIZED."
          # Deliberately no write token, approval, merge, or deployment step.

      - name: Check candidate with independently versioned trusted classifier (NO RELEASE)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Execute trusted risk classifier
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          LEVEL2A_ENABLED: ${{ vars.LEVEL2A_ENABLED }}
          LEVEL2A_EMERGENCY_STOP: ${{ vars.LEVEL2A_EMERGENCY_STOP }}
        run: node scripts/level2a-trusted-classify.mjs
